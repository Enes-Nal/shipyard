<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal launch video</title>
<!-- The launch video as one page. Every frame is a pure function of time:
     window.seek(t) puts the page at t seconds, and scripts/render.mjs steps
     it frame by frame in headless Chrome. Open it through `npm run preview`
     (it needs the repository's root served, for the fonts and beats.json). -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="ground"></div>
  <div id="harbour-wrap"></div>
  <div id="layers"></div>
  <div id="hud" hidden></div>
</div>
<script src="video.js"></script>
</body>
</html>
